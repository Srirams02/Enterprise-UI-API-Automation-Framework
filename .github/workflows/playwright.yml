name: Playwright Automation Framework

permissions:
  contents: write

on:

  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '30 10 * * *'

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: Extract Test Summary
        if: always()
        shell: bash
        run: |

          PASSED=$(grep -r '\"status\":\"passed\"' allure-results | wc -l || true)

          FAILED=$(grep -r '\"status\":\"failed\"' allure-results | wc -l || true)

          BROKEN=$(grep -r '\"status\":\"broken\"' allure-results | wc -l || true)

          TOTAL=$((PASSED + FAILED + BROKEN))

          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "BROKEN=$BROKEN" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}

          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: |
            Playwright Automation Report - Run #${{ github.run_number }}

          to: ${{ secrets.EMAIL_TO }}

          from: ${{ secrets.EMAIL_USERNAME }}

          html_body: |

            <h2>Playwright Automation Execution Report</h2>

            <hr>

            <p><b>Total Tests:</b> ${{ env.TOTAL }}</p>

            <p>✅ Passed: ${{ env.PASSED }}</p>

            <p>❌ Failed: ${{ env.FAILED }}</p>

            <p>⚠️ Broken: ${{ env.BROKEN }}</p>

            <hr>

            <h3>Live Allure Report</h3>

            <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/">
              Open Allure Dashboard
            </a>

            <br><br>

            <p><i>Generated via GitHub Actions</i></p>
